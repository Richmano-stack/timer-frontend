services:
  postgres:
    image: postgres:16-alpine
    container_name: timer-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: timer_user
      POSTGRES_PASSWORD: timer_secret
      POSTGRES_DB: timer_db
    volumes:
      - timer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timer_user -d timer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timer_pg_data:
