name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Test (unit)
        run: pnpm test:run

      - name: Start test database
        run: pnpm test:db:up

      - name: Migrate test database
        run: pnpm test:db:migrate
        env:
          TEST_DATABASE_URL: postgresql://timer_test_user:timer_test_secret@localhost:5435/timer_test

      - name: Test (integration)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://timer_test_user:timer_test_secret@localhost:5435/timer_test
          BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Stop test database
        if: always()
        run: pnpm test:db:down

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-build-secret-minimum-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
